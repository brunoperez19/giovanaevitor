<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" role="img" aria-label="Pomba carregando convite">
  <defs>
    <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a4b66"/>
      <stop offset="100%" stop-color="#1C3A54"/>
    </linearGradient>
    <linearGradient id="envGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F1E3DD"/>
      <stop offset="100%" stop-color="#E4C7BE"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1C3A54" flood-opacity="0.18"/>
    </filter>
  </defs>

  <style>
    .float {
      animation: float 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    .wing-left {
      animation: flapLeft 0.55s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 118px 118px;
    }

    .wing-right {
      animation: flapRight 0.55s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: 202px 118px;
    }

    .envelope {
      animation: sway 2.4s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center top;
    }

    .ribbon {
      animation: ribbonPulse 1.8s ease-in-out infinite;
      transform-box: fill-box;
      transform-origin: center;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    @keyframes flapLeft {
      0%, 100% { transform: rotate(8deg) scaleY(1); }
      50% { transform: rotate(-22deg) scaleY(0.92); }
    }

    @keyframes flapRight {
      0%, 100% { transform: rotate(-8deg) scaleY(1); }
      50% { transform: rotate(22deg) scaleY(0.92); }
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    @keyframes ribbonPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
  </style>

  <g class="float" filter="url(#softShadow)">
    <!-- Convite -->
    <g class="envelope" transform="translate(96 168)">
      <rect x="0" y="0" width="128" height="82" rx="6" fill="url(#envGrad)" stroke="#1C3A54" stroke-width="2"/>
      <path d="M0 0 L64 34 L128 0" fill="none" stroke="#1C3A54" stroke-width="2" stroke-linejoin="round"/>
      <path d="M0 82 L64 48 L128 82" fill="none" stroke="#1C3A54" stroke-width="1.5" opacity="0.45"/>
      <circle class="ribbon" cx="64" cy="40" r="9" fill="#1C3A54"/>
      <path d="M64 49 L58 62 L64 57 L70 62 Z" fill="#1C3A54"/>
      <text x="64" y="24" text-anchor="middle" font-family="Georgia, serif" font-size="9" fill="#1C3A54" letter-spacing="1.2">CONVITE</text>
    </g>

    <!-- Corda -->
    <path d="M160 150 C160 158 160 164 160 168" fill="none" stroke="#1C3A54" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Asa esquerda -->
    <g class="wing-left">
      <path d="M118 118 C78 92 42 98 28 118 C48 126 78 132 118 128 Z" fill="url(#wingGrad)"/>
      <path d="M118 118 C92 108 72 112 58 118" fill="none" stroke="#F1E3DD" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Asa direita -->
    <g class="wing-right">
      <path d="M202 118 C242 92 278 98 292 118 C272 126 242 132 202 128 Z" fill="url(#wingGrad)"/>
      <path d="M202 118 C228 108 248 112 262 118" fill="none" stroke="#F1E3DD" stroke-width="1.2" opacity="0.35"/>
    </g>

    <!-- Corpo -->
    <ellipse cx="160" cy="122" rx="34" ry="24" fill="#1C3A54"/>
    <ellipse cx="160" cy="126" rx="22" ry="14" fill="#2a4b66" opacity="0.55"/>

    <!-- Cauda -->
    <path d="M160 142 C148 168 132 176 124 168 C136 160 148 152 160 148 Z" fill="#1C3A54"/>
    <path d="M160 142 C172 168 188 176 196 168 C184 160 172 152 160 148 Z" fill="#2a4b66"/>

    <!-- Pescoço e cabeça -->
    <path d="M160 102 C160 88 168 78 178 74" fill="none" stroke="#1C3A54" stroke-width="10" stroke-linecap="round"/>
    <circle cx="184" cy="72" r="11" fill="#1C3A54"/>
    <circle cx="188" cy="69" r="2.3" fill="#F1E3DD"/>

    <!-- Bico -->
    <path d="M194 74 L206 76 L194 79 Z" fill="#DDBBB1" stroke="#1C3A54" stroke-width="1" stroke-linejoin="round"/>

    <!-- Pés -->
    <path d="M148 144 L144 152 M152 145 L148 153" fill="none" stroke="#1C3A54" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M168 144 L172 152 M164 145 L168 153" fill="none" stroke="#1C3A54" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
